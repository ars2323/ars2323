<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Hakhyeon Kim — Computer Architecture, RISC-V, AI Accelerators">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1321"/>
      <stop offset="1" stop-color="#1b2540"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f4b860"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .stage { fill: #1f2b4d; stroke: #4a5d93; stroke-width: 1.5; }
      .reg { fill: #f4b860; }
      .pe { fill: #1f2b4d; stroke: #4a5d93; stroke-width: 1.2; }
      .flow { stroke: #f4b860; stroke-width: 1.6; fill: none; }
      .pulse { animation: p 2.4s ease-in-out infinite; }
      .d1 { animation-delay: .3s } .d2 { animation-delay: .6s } .d3 { animation-delay: .9s }
      .d4 { animation-delay: 1.2s } .d5 { animation-delay: 1.5s } .d6 { animation-delay: 1.8s }
      @keyframes p { 0%,100% { fill: #1f2b4d } 40% { fill: #b8781f } }
    </style>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>

  <!-- Title -->
  <text x="48" y="78" class="sans" font-size="40" font-weight="700" fill="#ece6da">Hakhyeon Kim</text>
  <text x="48" y="110" class="mono" font-size="15" fill="#9fb0e8">Computer Architecture · RISC-V · AI Accelerators</text>

  <!-- 5-stage pipeline -->
  <g class="mono" font-size="13" text-anchor="middle">
    <rect class="stage" x="48"  y="160" width="72" height="44" rx="6"/>
    <rect class="reg"   x="126" y="156" width="6"  height="52" rx="2"/>
    <rect class="stage" x="138" y="160" width="72" height="44" rx="6"/>
    <rect class="reg"   x="216" y="156" width="6"  height="52" rx="2"/>
    <rect class="stage" x="228" y="160" width="72" height="44" rx="6"/>
    <rect class="reg"   x="306" y="156" width="6"  height="52" rx="2"/>
    <rect class="stage" x="318" y="160" width="72" height="44" rx="6"/>
    <rect class="reg"   x="396" y="156" width="6"  height="52" rx="2"/>
    <rect class="stage" x="408" y="160" width="72" height="44" rx="6"/>

    <text x="84"  y="187" fill="#ece6da">IF</text>
    <text x="174" y="187" fill="#ece6da">ID</text>
    <text x="264" y="187" fill="#ece6da">EX</text>
    <text x="354" y="187" fill="#ece6da">MEM</text>
    <text x="444" y="187" fill="#ece6da">WB</text>
  </g>
  <!-- forwarding path EX/MEM -> EX -->
  <path class="flow" d="M354 204 V226 H258 V210" marker-end="url(#arr)"/>
  <text x="306" y="244" class="mono" font-size="11" fill="#f4b860" text-anchor="middle">forward</text>
  <text x="48" y="146" class="mono" font-size="11" fill="#6f7ea8">rv32i_core.v</text>

  <!-- divider -->
  <line x1="540" y1="140" x2="540" y2="240" stroke="#4a5d93" stroke-opacity="0.5" stroke-dasharray="3 4"/>

  <!-- Systolic array 4x4 -->
  <text x="600" y="146" class="mono" font-size="11" fill="#6f7ea8">systolic_array #(4,4)</text>
  <g>
    <rect class="pe pulse"    x="600" y="156" width="22" height="22" rx="3"/>
    <rect class="pe pulse d1" x="628" y="156" width="22" height="22" rx="3"/>
    <rect class="pe pulse d2" x="656" y="156" width="22" height="22" rx="3"/>
    <rect class="pe pulse d3" x="684" y="156" width="22" height="22" rx="3"/>
    <rect class="pe pulse d1" x="600" y="184" width="22" height="22" rx="3"/>
    <rect class="pe pulse d2" x="628" y="184" width="22" height="22" rx="3"/>
    <rect class="pe pulse d3" x="656" y="184" width="22" height="22" rx="3"/>
    <rect class="pe pulse d4" x="684" y="184" width="22" height="22" rx="3"/>
    <rect class="pe pulse d2" x="600" y="212" width="22" height="22" rx="3"/>
    <rect class="pe pulse d3" x="628" y="212" width="22" height="22" rx="3"/>
    <rect class="pe pulse d4" x="656" y="212" width="22" height="22" rx="3"/>
    <rect class="pe pulse d5" x="684" y="212" width="22" height="22" rx="3"/>
    <rect class="pe pulse d3" x="600" y="240" width="22" height="22" rx="3"/>
    <rect class="pe pulse d4" x="628" y="240" width="22" height="22" rx="3"/>
    <rect class="pe pulse d5" x="656" y="240" width="22" height="22" rx="3"/>
    <rect class="pe pulse d6" x="684" y="240" width="22" height="22" rx="3"/>
  </g>
  <!-- data-in arrows -->
  <g class="flow" marker-end="url(#arr)">
    <path d="M568 167 H594"/><path d="M568 195 H594"/><path d="M568 223 H594"/><path d="M568 251 H594"/>
  </g>
  <text x="560" y="171" class="mono" font-size="10" fill="#9fb0e8" text-anchor="end">a₀</text>
  <text x="560" y="199" class="mono" font-size="10" fill="#9fb0e8" text-anchor="end">a₁</text>
  <text x="560" y="227" class="mono" font-size="10" fill="#9fb0e8" text-anchor="end">a₂</text>
  <text x="560" y="255" class="mono" font-size="10" fill="#9fb0e8" text-anchor="end">a₃</text>

  <!-- Right: tagline -->
  <g class="mono" font-size="13" fill="#ece6da">
    <text x="760" y="176"><tspan fill="#f4b860">$</tspan> from instructions</text>
    <text x="760" y="200"><tspan fill="#f4b860"> </tspan> to circuits,</text>
    <text x="760" y="224"><tspan fill="#f4b860"> </tspan> and then to NPUs.</text>
    <rect x="760" y="236" width="9" height="16" fill="#f4b860">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
